<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yoha</title>
    <style>
        /* จัดโครงสร้างหน้าเว็บทั้งหมดให้อยู่ตรงกลางแนวนอน */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* เริ่มจัดวางจากด้านบนลงมา */
            min-height: 100vh;
            margin: 0;
            padding-top: 80px; /* เว้นระยะด้านบนสุดไม่ให้กล่อง Url ติดขอบจอเกินไป */
            background-color: #ffffff;
            position: relative;
            box-sizing: border-box;
        }

        /* ส่วนหัวด้านซ้ายบน: ชื่อเว็บ + ปุ่มหมู่แอป 9 จุด */
        .header-container {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title {
            margin: 0;
            font-size: 24px;
            font-weight: bold;
        }

        /* ปุ่มหมู่แอป 9 จุด */
        .app-launcher {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .app-launcher:hover {
            background-color: #f0f0f0;
        }

        .app-launcher span {
            width: 4px;
            height: 4px;
            background-color: #000000;
            border-radius: 50%;
        }

        /* จัดกลุ่มองค์ประกอบของกล่องข้อความและปุ่ม */
        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0; /* เว้นระยะห่างบน-ล่างให้สมดุล */
        }

        /* ตกแต่งกล่องพิมพ์ข้อความ (Input) ทรงมนรี */
        input[type="text"] {
            width: 300px;
            padding: 12px 20px;
            font-size: 18px;
            border: 2px solid #1a2a3a;
            border-radius: 50px; 
            outline: none;
            box-sizing: border-box;
        }

        /* ตกแต่งปุ่มกด (Button) */
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #ffffff;
            border: 2px solid #1a2a3a;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #1a2a3a;
            color: white;
        }

        /* จัดการขนาดและการเว้นระยะของโลโก้รูปภาพตรงกลาง */
        .logo-image {
            width: 150px;
            margin: 30px 0; /* เว้นช่องไฟระหว่างกล่องบนกับกล่องล่าง */
        
    </style> 
            <style>
        /* ตั้งค่าพื้นฐาน */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ส่วนควบคุม (Control Panel) */
        .control-panel {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 800px;
        }

        input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #0056b3;
        }

        /* กรอบแสดงเว็บไซต์ (Showcase Frame) */
        .web-container {
            width: 100%;
            max-width: 1000px;
            height: 600px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            overflow: hidden; /* บังคับให้มุมโค้งมน */
            border: 1px solid #e1e4e8;
        }

        /* สไตล์ของ iframe */
        .web-frame {
            width: 100%;
            height: 100%;
            border: none; /* ลบเส้นขอบเดิมของ iframe */
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <input type="text" id="urlInput" value="https://yoha-home.vercel.app/" placeholder="URL">
        <button onclick="changeWebsite()">Letgo</button>
    </div>

    <div class="web-container">
        <iframe 
            id="myFrame" 
            src="https://example.com" 
            class="web-frame"
            allowfullscreen>
        </iframe>
    </div>

    <script>
        function changeWebsite() {
            const urlInput = document.getElementById('urlInput').value;
            const iframe = document.getElementById('myFrame');
            
            if (urlInput) {
                // ตรวจสอบเบื้องต้นว่าผู้ใช้ใส่ http:// หรือ https:// หรือยัง
                if (!urlInput.startsWith('http://') && !urlInput.startsWith('https://')) {
                    
                    return;
                }
                iframe.src = urlInput;
            }
        }
    </script>
        
    </script>
    
</head>

   <div class="header-container">
       <h1 class="header-title">• yoha</h1>
       <div class="app-launcher" title="แอป Yoha" onclick="">
           <span></span><span></span><span></span>
           <span></span><span></span><span></span>
           <span></span><span></span><span></span>
       </div>
   </div>
   
  

   
   

</body>
</html>
