<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>yoha</title>
    <style>
        /* จัดโครงสร้างหน้าเว็บทั้งหมดให้อยู่ตรงกลางแนวนอน */
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start; /* เริ่มจัดวางจากด้านบนลงมา */
            min-height: 100vh;
            margin: 0;
            padding-top: 80px; /* เว้นระยะด้านบนสุดไม่ให้กล่อง Url ติดขอบจอเกินไป */
            background-color: #ffffff;
            position: relative;
            box-sizing: border-box;
        }

        /* ส่วนหัวด้านซ้ายบน: ชื่อเว็บ + ปุ่มหมู่แอป 9 จุด */
        .header-container {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-title {
            margin: 0;
            font-size: 24px;
            font-weight: bold;
        }

        /* ปุ่มหมู่แอป 9 จุด */
        .app-launcher {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
            width: 18px;
            height: 18px;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            transition: background 0.2s;
        }

        .app-launcher:hover {
            background-color: #f0f0f0;
        }

        .app-launcher span {
            width: 4px;
            height: 4px;
            background-color: #000000;
            border-radius: 50%;
        }

        /* จัดกลุ่มองค์ประกอบของกล่องข้อความและปุ่ม */
        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 20px 0; /* เว้นระยะห่างบน-ล่างให้สมดุล */
        }

        /* ตกแต่งกล่องพิมพ์ข้อความ (Input) ทรงมนรี */
        input[type="text"] {
            width: 300px;
            padding: 12px 20px;
            font-size: 18px;
            border: 2px solid #1a2a3a;
            border-radius: 50px; 
            outline: none;
            box-sizing: border-box;
        }

        /* ตกแต่งปุ่มกด (Button) */
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #ffffff;
            border: 2px solid #1a2a3a;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #1a2a3a;
            color: white;
        }

        /* จัดการขนาดและการเว้นระยะของโลโก้รูปภาพตรงกลาง */
        .logo-image {
            width: 150px;
            margin: 30px 0; /* เว้นช่องไฟระหว่างกล่องบนกับกล่องล่าง */
        }
    </style>
</head>
<body>

   <div class="header-container">
       <h1 class="header-title">• yoha</h1>
       <div class="app-launcher" title="แอป Yoha" onclick="alert('คุณคลิกเปิดหมู่แอป!')">
           <span></span><span></span><span></span>
           <span></span><span></span><span></span>
           <span></span><span></span><span></span>
       </div>
   </div>
   
   <div class="input-group">
       <input type="text" id="urlInput" placeholder="Url">
       <button onclick="goToURL()">Letgo</button>
   </div>

   <img src="logo.png" alt="Yoha Logo" class="logo-image">
           
   <form action="https://www.google.com/search" method="get" target="_blank" class="input-group">
      <input type="text" name="q" placeholder="Search" required>
      <button type="submit">Search</button>
   </form>

   <script>
   function goToURL() {
     var url = document.getElementById("urlInput").value;
     if (!url.startsWith("http")) {
       url = "https://" + url;
     }
     window.open(url, '_blank');
   }
   </script>

</body>
</html>
